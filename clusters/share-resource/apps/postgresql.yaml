---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-config
  namespace: share-resource
  labels:
    app: postgresql
    environment: share-resource
data:
  PGDATA: /var/lib/postgresql/data/pgdata

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: share-resource
  labels:
    app: postgresql
    environment: share-resource
spec:
  selector:
    app: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP

---
# Headless service required by StatefulSet for stable DNS per pod
# e.g. postgresql-0.postgresql-headless.share-resource.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
  namespace: share-resource
  labels:
    app: postgresql
    environment: share-resource
spec:
  clusterIP: None
  selector:
    app: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql
  namespace: share-resource
  labels:
    app: postgresql
    environment: share-resource

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: share-resource
  labels:
    app: postgresql
    environment: share-resource
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        environment: share-resource
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "share-resource"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-secret-postgresql.env: "secret/postgresql/share-resource"
        # KV v1: values are accessed directly under .Data.*
        vault.hashicorp.com/agent-inject-template-postgresql.env: |
          {{- with secret "secret/postgresql/share-resource" -}}
          export POSTGRES_USER="{{ .Data.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="{{ .Data.POSTGRES_PASSWORD }}"
          export POSTGRES_DB="{{ .Data.POSTGRES_DB }}"
          {{- end }}

    spec:
      serviceAccountName: postgresql
      securityContext:
        fsGroup: 999

      containers:
        - name: postgresql
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ -f /vault/secrets/postgresql.env ]; do
                echo "[vault-wait] Waiting for secret file to appear..."
                sleep 2
              done
              until [ -s /vault/secrets/postgresql.env ]; do
                echo "[vault-wait] Secret file exists but is empty, waiting..."
                sleep 2
              done
              source /vault/secrets/postgresql.env
              exec docker-entrypoint.sh postgres
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgresql-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  [ -s /vault/secrets/postgresql.env ] || exit 1
                  source /vault/secrets/postgresql.env
                  pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  [ -s /vault/secrets/postgresql.env ] || exit 1
                  source /vault/secrets/postgresql.env
                  pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
        labels:
          app: postgresql
          environment: share-resource
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
# ─────────────────────────────────────────────────────────────
# PGBOUNCER
# ─────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: share-resource
data:
  pgbouncer.ini: |
    [databases]
    * = host=postgresql port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432

    auth_type = plain
    auth_file = /var/run/pgbouncer/userlist.txt

    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 50

    ignore_startup_parameters = extra_float_digits

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: share-resource
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "share-resource"
        vault.hashicorp.com/agent-inject-secret-postgresql.env: "secret/postgresql/share-resource"
        vault.hashicorp.com/agent-inject-template-postgresql.env: |
          {{- with secret "secret/postgresql/share-resource" -}}
          export POSTGRES_USER="{{ .Data.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="{{ .Data.POSTGRES_PASSWORD }}"
          export POSTGRES_DB="{{ .Data.POSTGRES_DB }}"
          {{- end }}
    spec:
      serviceAccountName: postgresql
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "waiting vault..."
              until [ -s /vault/secrets/postgresql.env ]; do sleep 2; done
              source /vault/secrets/postgresql.env

              echo "\"$POSTGRES_USER\" \"$POSTGRES_PASSWORD\"" > /var/run/pgbouncer/userlist.txt

              exec pgbouncer /etc/pgbouncer/pgbouncer.ini
          ports:
            - containerPort: 6432
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini

            - name: runtime
              mountPath: /var/run/pgbouncer
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config

        - name: runtime
          emptyDir: { }

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: share-resource
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 6432

# ─────────────────────────────────────────────────────────────
# HAPROXY
# ─────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
  namespace: share-resource
data:
  haproxy.cfg: |
    global
      maxconn 2000

    defaults
      mode tcp
      timeout connect 5s
      timeout client  1m
      timeout server  1m

    frontend postgres
      bind *:5432
      default_backend db_pool

    backend db_pool
      option tcp-check
      tcp-check connect
      server pgbouncer pgbouncer:6432 check

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: share-resource
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
        - name: haproxy
          image: haproxy:2.9
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: haproxy-config

---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: share-resource
spec:
  type: NodePort
  selector:
    app: haproxy
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30032
# ─────────────────────────────────────────────────────────────────────────────
# VAULT SECRET SETUP
# Engine : secret  (KV v1)
# Path   : secret/postgresql/share-resource
#
# Provision secrets before syncing this manifest:
#
#   vault kv put secret/postgresql/share-resource \
#     POSTGRES_USER="<db-username>" \
#     POSTGRES_PASSWORD="<strong-random-password>" \
#     POSTGRES_DB="<database-name>"
#
# Vault policy required (share-resource):
#   path "secret/*" {
#     capabilities = ["read"]
#   }
#
# Vault Kubernetes auth role (share-resource):
#   bound_service_account_names      = ["*"]
#   bound_service_account_namespaces = ["share-resource"]
#   policies                         = ["share-resource"]
#   ttl                              = "1h"
# ─────────────────────────────────────────────────────────────────────────────

