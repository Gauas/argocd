---
# ─────────────────────────────────────────────────────────────
# TRAEFIK MIDDLEWARES — share-resource
# Shared middlewares applied across all Ingress resources.
# Reference format in Ingress annotation:
#   traefik.ingress.kubernetes.io/router.middlewares: share-resource-cors@kubernetescrd
# ─────────────────────────────────────────────────────────────

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors
  namespace: share-resource
  labels:
    environment: share-resource
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - "*"
    accessControlAllowOriginList:
      - "https://gauas.com"
      - "https://www.gauas.com"
    accessControlMaxAge: 86400
    addVaryHeader: true
