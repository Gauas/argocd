---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-service
  namespace: production
  labels:
    app: account-service
    environment: production

---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: production
  labels:
    app: account-service
    environment: production
spec:
  selector:
    app: account-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: account-service
  namespace: production
  labels:
    app: account-service
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.middlewares: shared-service-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.gauas.com
      http:
        paths:
          - path: /v1/account
            pathType: Prefix
            backend:
              service:
                name: account-service
                port:
                  number: 80
          - path: /v1/auth
            pathType: Prefix
            backend:
              service:
                name: account-service
                port:
                  number: 80
          - path: /v1/session
            pathType: Prefix
            backend:
              service:
                name: account-service
                port:
                  number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: production
  labels:
    app: account-service
    environment: production
  annotations:
    argocd-image-updater.argoproj.io/image-list: account=gauaslab/account-service-jar
    argocd-image-updater.argoproj.io/account.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
        environment: production
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "production"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-secret-account-service.env: "secret/account-service/production"
        vault.hashicorp.com/agent-inject-file-account-service.env: ".env"
        vault.hashicorp.com/agent-inject-template-account-service.env: |
          {{- with secret "secret/account-service/production" -}}
          {{- range $key, $value := .Data }}
          export {{ $key }}={{ printf "%q" $value }}
          {{- end }}
          {{- end }}
    spec:
      serviceAccountName: account-service
      containers:
        - name: account-service
          image: gauaslab/account-service-jar:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              ENV_FILE="/vault/secrets/.env"
              until [ -f "$ENV_FILE" ]; do
                echo "[vault-wait] Waiting for secret file..."
                sleep 2
              done
              until [ -s "$ENV_FILE" ]; do
                echo "[vault-wait] Secret file is empty, waiting..."
                sleep 2
              done
              set -a
              . "$ENV_FILE"
              set +a
              exec java -jar /app/account-service.jar
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /v1/account/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/account/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/account/health
              port: 8080
            periodSeconds: 10
