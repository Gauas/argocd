---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-service
  namespace: production
  labels:
    app: account-service
    environment: production

---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: production
  labels:
    app: account-service
    environment: production
spec:
  selector:
    app: account-service
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: account-public
  namespace: production
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.middlewares: production-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.gauas.com
      http:
        paths:
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service:
                name: account-service
                port:
                  name: http
          - path: /v1/auth
            pathType: Prefix
            backend:
              service:
                name: account-service
                port:
                  name: http
          - path: /v1/account/health
            pathType: Prefix
            backend:
              service:
                name: account-service
                port:
                  name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: account-protected
  namespace: production
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.middlewares: production-cors@kubernetescrd,production-protected@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.gauas.com
      http:
        paths:
          - path: /v1/auth/logout
            pathType: Exact
            backend:
              service:
                name: account-service
                port:
                  name: http
          - path: /v1/auth/logout-all
            pathType: Exact
            backend:
              service:
                name: account-service
                port:
                  name: http
          - path: /v1/users
            pathType: Prefix
            backend:
              service:
                name: account-service
                port:
                  name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: production
  labels:
    app: account-service
    environment: production
  annotations:
    argocd-image-updater.argoproj.io/image-list: account=gauaslab/account-service
    argocd-image-updater.argoproj.io/account.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
        environment: production
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "production"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-secret-account-service.env: "secret/account-service/production"
        vault.hashicorp.com/agent-inject-file-account-service.env: ".env"
        vault.hashicorp.com/agent-inject-template-account-service.env: |
          {{- with secret "secret/account-service/production" -}}
          {{- range $key, $value := .Data }}
          export {{ $key }}={{ printf "%q" $value }}
          {{- end }}
          {{- end }}
    spec:
      serviceAccountName: account-service
      containers:
        - name: account-service
          image: gauaslab/account-service:latest
          imagePullPolicy: Always
          env:
            - name: HTTP_SECURE
              value: "true"
          command: ["/bin/sh", "-c"]
          args:
            - |
              ENV_FILE="/vault/secrets/.env"
              until [ -s "$ENV_FILE" ]; do
                sleep 2
              done
              set -a
              . "$ENV_FILE"
              set +a
              exec ./account-service
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /v1/account/health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /v1/account/health/live
              port: http
