---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authorization-service
  namespace: production
  labels:
    app: authorization-service
    environment: production

---
apiVersion: v1
kind: Service
metadata:
  name: authorization-service
  namespace: production
  labels:
    app: authorization-service
    environment: production
spec:
  selector:
    app: authorization-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-service
  namespace: production
  labels:
    app: authorization-service
    environment: production
  annotations:
    argocd-image-updater.argoproj.io/image-list: auth=gauaslab/authorization-service
    argocd-image-updater.argoproj.io/auth.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authorization-service
  template:
    metadata:
      labels:
        app: authorization-service
        environment: production
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "production"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-authorization-service.env: "secret/authorization-service/production"
        vault.hashicorp.com/agent-inject-file-authorization-service.env: ".env"
        vault.hashicorp.com/agent-inject-template-authorization-service.env: |
          {{- with secret "secret/authorization-service/production" -}}
          {{- range $key, $value := .Data }}
          export {{ $key }}={{ printf "%q" $value }}
          {{- end }}
          {{- end }}
    spec:
      serviceAccountName: authorization-service
      containers:
        - name: authorization-service
          image: gauaslab/authorization-service:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              ENV_FILE="/vault/secrets/.env"
              until [ -s "$ENV_FILE" ]; do
                sleep 2
              done
              set -a
              . "$ENV_FILE"
              set +a
              exec ./authorization-service
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
