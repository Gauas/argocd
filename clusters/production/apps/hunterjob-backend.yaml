apiVersion: v1
kind: ServiceAccount
metadata:
  name: hunterjob-backend
  namespace: production
  labels:
    app: hunterjob-backend
    environment: production

---
apiVersion: v1
kind: Service
metadata:
  name: hunterjob-backend
  namespace: production
  labels:
    app: hunterjob-backend
    environment: production
spec:
  selector:
    app: hunterjob-backend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunterjob-backend
  namespace: production
  labels:
    app: hunterjob-backend
    environment: production
  annotations:
    argocd-image-updater.argoproj.io/image-list: api=gauaslab/hunterjob-api
    argocd-image-updater.argoproj.io/api.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hunterjob-backend
  template:
    metadata:
      labels:
        app: hunterjob-backend
        environment: production
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "production"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-secret-hunterjob-backend.env: "secret/hunterjob-backend/production"
        vault.hashicorp.com/agent-inject-file-hunterjob-backend.env: ".env"
        vault.hashicorp.com/agent-inject-template-hunterjob-backend.env: |
          {{- with secret "secret/hunterjob-backend/production" -}}
          {{- range $key, $value := .Data }}
          export {{ $key }}={{ printf "%q" $value }}
          {{- end }}
          {{- end }}
    spec:
      serviceAccountName: hunterjob-backend
      containers:
        - name: hunterjob-backend
          image: gauaslab/hunterjob-api:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              ENV_FILE="/vault/secrets/.env"
              until [ -s "$ENV_FILE" ]; do
                sleep 2
              done
              set -a
              . "$ENV_FILE"
              set +a
              exec /api
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunterjob-crawler
  namespace: production
  labels:
    app: hunterjob-crawler
    environment: production
  annotations:
    argocd-image-updater.argoproj.io/image-list: crawler=gauaslab/hunterjob-crawler
    argocd-image-updater.argoproj.io/crawler.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hunterjob-crawler
  template:
    metadata:
      labels:
        app: hunterjob-crawler
        environment: production
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "production"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-secret-hunterjob-crawler.env: "secret/hunterjob-backend/production"
        vault.hashicorp.com/agent-inject-file-hunterjob-crawler.env: ".env"
        vault.hashicorp.com/agent-inject-template-hunterjob-crawler.env: |
          {{- with secret "secret/hunterjob-backend/production" -}}
          {{- range $key, $value := .Data }}
          export {{ $key }}={{ printf "%q" $value }}
          {{- end }}
          {{- end }}
    spec:
      serviceAccountName: hunterjob-backend
      containers:
        - name: hunterjob-crawler
          image: gauaslab/hunterjob-crawler:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              ENV_FILE="/vault/secrets/.env"
              until [ -s "$ENV_FILE" ]; do
                sleep 2
              done
              set -a
              . "$ENV_FILE"
              set +a
              exec /worker
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
