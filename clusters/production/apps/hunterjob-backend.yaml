apiVersion: v1
kind: ServiceAccount
metadata:
  name: hunterjob-backend
  namespace: production
  labels:
    app: hunterjob-backend
    environment: production

---
apiVersion: v1
kind: Service
metadata:
  name: hunterjob-backend
  namespace: production
  labels:
    app: hunterjob-backend
    environment: production
spec:
  selector:
    app: hunterjob-backend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hunterjob-public
  namespace: production
  labels:
    app: hunterjob-backend
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.middlewares: production-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.gauas.com
      http:
        paths:
          - path: /v1/hunterjob/health
            pathType: Exact
            backend:
              service:
                name: hunterjob-backend
                port:
                  number: 80
          - path: /v1/hunterjob/ready
            pathType: Exact
            backend:
              service:
                name: hunterjob-backend
                port:
                  number: 80
          - path: /v1/hunterjob/webhooks/telegram
            pathType: Exact
            backend:
              service:
                name: hunterjob-backend
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hunterjob-backend
  namespace: production
  labels:
    app: hunterjob-backend
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.middlewares: production-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.gauas.com
      http:
        paths:
          - path: /v1/hunterjob/dashboard
            pathType: Exact
            backend:
              service:
                name: hunterjob-backend
                port:
                  number: 80
          - path: /v1/hunterjob/search-preference
            pathType: Prefix
            backend:
              service:
                name: hunterjob-backend
                port:
                  number: 80
          - path: /v1/hunterjob/matches
            pathType: Prefix
            backend:
              service:
                name: hunterjob-backend
                port:
                  number: 80
          - path: /v1/hunterjob/connections
            pathType: Prefix
            backend:
              service:
                name: hunterjob-backend
                port:
                  number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunterjob-backend
  namespace: production
  labels:
    app: hunterjob-backend
    environment: production
  annotations:
    argocd-image-updater.argoproj.io/image-list: api=gauaslab/hunterjob-api
    argocd-image-updater.argoproj.io/api.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hunterjob-backend
  template:
    metadata:
      labels:
        app: hunterjob-backend
        environment: production
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/log-level: "warn"
        vault.hashicorp.com/role: "production"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-hunterjob-backend.env: "secret/hunterjob-backend/production"
        vault.hashicorp.com/agent-inject-file-hunterjob-backend.env: ".env"
        vault.hashicorp.com/agent-inject-template-hunterjob-backend.env: |
          {{- with secret "secret/hunterjob-backend/production" -}}
          {{- range $key, $value := .Data }}
          export {{ $key }}={{ printf "%q" $value }}
          {{- end }}
          {{- end }}
    spec:
      serviceAccountName: hunterjob-backend
      containers:
        - name: hunterjob-backend
          image: gauaslab/hunterjob-api:sha-ddec2b19be8bb87e78b757926f6abc5d467e950f@sha256:cf6c1ece5fbf4c52b3cb618f173a4210aecf1b014f65780cf64d767af979b5fa
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              ENV_FILE="/vault/secrets/.env"
              until [ -s "$ENV_FILE" ]; do
                sleep 2
              done
              set -a
              . "$ENV_FILE"
              set +a
              export JWKS_URL=http://identity-service.production.svc.cluster.local/.well-known/jwks.json
              exec /api
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /v1/hunterjob/ready
              port: http
          livenessProbe:
            httpGet:
              path: /v1/hunterjob/health
              port: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunterjob-crawler
  namespace: production
  labels:
    app: hunterjob-crawler
    environment: production
  annotations:
    argocd-image-updater.argoproj.io/image-list: crawler=gauaslab/hunterjob-crawler
    argocd-image-updater.argoproj.io/crawler.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hunterjob-crawler
  template:
    metadata:
      labels:
        app: hunterjob-crawler
        environment: production
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "production"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-hunterjob-crawler.env: "secret/hunterjob-backend/production"
        vault.hashicorp.com/agent-inject-file-hunterjob-crawler.env: ".env"
        vault.hashicorp.com/agent-inject-template-hunterjob-crawler.env: |
          {{- with secret "secret/hunterjob-backend/production" -}}
          {{- range $key, $value := .Data }}
          export {{ $key }}={{ printf "%q" $value }}
          {{- end }}
          {{- end }}
    spec:
      serviceAccountName: hunterjob-backend
      containers:
        - name: hunterjob-crawler
          image: gauaslab/hunterjob-crawler:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              ENV_FILE="/vault/secrets/.env"
              until [ -s "$ENV_FILE" ]; do
                sleep 2
              done
              set -a
              . "$ENV_FILE"
              set +a
              exec /worker
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
