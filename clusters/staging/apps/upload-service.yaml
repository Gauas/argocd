---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: upload-service
  namespace: staging
  labels:
    app: upload-service
    environment: staging

---
apiVersion: v1
kind: Service
metadata:
  name: upload-service
  namespace: staging
  labels:
    app: upload-service
    environment: staging
spec:
  selector:
    app: upload-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upload-service
  namespace: staging
  labels:
    app: upload-service
    environment: staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ingressClassName: traefik
  rules:
    - host: api.gauas.com
      http:
        paths:
          - path: /v1/upload
            pathType: Prefix
            backend:
              service:
                name: upload-service
                port:
                  number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
  namespace: staging
  labels:
    app: upload-service
    environment: staging
  annotations:
    argocd-image-updater.argoproj.io/image-list: upload=gauaslab/upload-service
    argocd-image-updater.argoproj.io/upload.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
        environment: staging
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "staging"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-secret-upload-service.env: "secret/upload-service/staging"
        vault.hashicorp.com/agent-inject-template-upload-service.env: |
          {{- with secret "secret/upload-service/staging" -}}
          export ENVIRONMENT="{{ .Data.ENVIRONMENT }}"
          export CONFIG_SERVICE_URL="{{ .Data.CONFIG_SERVICE_URL }}"
          export SECRET_KEY="{{ .Data.SECRET_KEY }}"
          {{- end }}
    spec:
      serviceAccountName: upload-service
      containers:
        - name: upload-service
          image: gauaslab/upload-service:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ -f /vault/secrets/upload-service.env ]; do
                echo "[vault-wait] Waiting for secret file..."
                sleep 2
              done
              until [ -s /vault/secrets/upload-service.env ]; do
                echo "[vault-wait] Secret file is empty, waiting..."
                sleep 2
              done
              source /vault/secrets/upload-service.env
              exec ./app
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /v1/upload/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/upload/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

# vault kv put secret/upload-service/staging \
#   ENVIRONMENT="staging" \
#   CONFIG_SERVICE_URL="http://config-service.staging.svc.cluster.local" \
#   SECRET_KEY="<shared-secret-key>"

---
apiVersion: v1
kind: Service
metadata:
  name: upload-consumer
  namespace: staging
  labels:
    app: upload-consumer
    environment: staging
spec:
  selector:
    app: upload-consumer
  ports:
    - name: metrics
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-consumer
  namespace: staging
  labels:
    app: upload-consumer
    environment: staging
  annotations:
    argocd-image-updater.argoproj.io/image-list: upload=gauaslab/upload-service
    argocd-image-updater.argoproj.io/upload.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload-consumer
  template:
    metadata:
      labels:
        app: upload-consumer
        environment: staging
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "staging"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-secret-upload-service.env: "secret/upload-service/staging"
        vault.hashicorp.com/agent-inject-template-upload-service.env: |
          {{- with secret "secret/upload-service/staging" -}}
          export ENVIRONMENT="{{ .Data.ENVIRONMENT }}"
          export CONFIG_SERVICE_URL="{{ .Data.CONFIG_SERVICE_URL }}"
          export SECRET_KEY="{{ .Data.SECRET_KEY }}"
          {{- end }}
        vault.hashicorp.com/agent-requests-cpu: "25m"
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-requests-mem: "64Mi"
        vault.hashicorp.com/agent-limits-mem: "128Mi"
    spec:
      serviceAccountName: upload-service
      containers:
        - name: upload-consumer
          image: gauaslab/upload-service:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ -f /vault/secrets/upload-service.env ]; do
                echo "[vault-wait] Waiting for secret file..."
                sleep 2
              done
              until [ -s /vault/secrets/upload-service.env ]; do
                echo "[vault-wait] Secret file is empty, waiting..."
                sleep 2
              done
              source /vault/secrets/upload-service.env
              exec ./consumer
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "200m"

