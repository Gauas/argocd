---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-service
  namespace: staging
  labels:
    app: account-service
    environment: staging

---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: staging
  labels:
    app: account-service
    environment: staging
spec:
  selector:
    app: account-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: account-service
  namespace: staging
  labels:
    app: account-service
    environment: staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.middlewares: staging-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.gauas.com
      http:
        paths:
          - path: /v1/account
            pathType: Prefix
            backend:
              service:
                name: account-service
                port:
                  number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: staging
  labels:
    app: account-service
    environment: staging
  annotations:
    argocd-image-updater.argoproj.io/image-list: account=gauaslab/account-service
    argocd-image-updater.argoproj.io/account.update-strategy: digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
        environment: staging
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "staging"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-secret-account-service.env: "secret/account-service/staging"
        vault.hashicorp.com/agent-inject-template-account-service.env: |
          {{- with secret "secret/account-service/staging" -}}
          export ENVIRONMENT="{{ .Data.ENVIRONMENT }}"
          export CONFIG_SERVICE_URL="{{ .Data.CONFIG_SERVICE_URL }}"
          export SECRET_KEY="{{ .Data.SECRET_KEY }}"
          {{- end }}
    spec:
      serviceAccountName: account-service
      containers:
        - name: account-service
          image: gauaslab/account-service:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ -f /vault/secrets/account-service.env ]; do
                echo "[vault-wait] Waiting for secret file..."
                sleep 2
              done
              until [ -s /vault/secrets/account-service.env ]; do
                echo "[vault-wait] Secret file is empty, waiting..."
                sleep 2
              done
              source /vault/secrets/account-service.env
              exec ./app
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /v1/account/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/account/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
