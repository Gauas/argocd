---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors
  namespace: staging
  labels:
    environment: staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - "*"
    accessControlAllowOriginList:
      - "https://gauas.com"
      - "https://www.gauas.com"
    accessControlMaxAge: 86400
    addVaryHeader: true
