---
# K3s merges HelmChartConfig values into its packaged Traefik chart. This adds
# a dedicated TCP entrypoint without changing the existing HTTP/HTTPS routes.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: postgresql-public-ingress
spec:
  valuesContent: |-
    ports:
      postgres:
        port: 5432
        expose:
          default: true
        exposedPort: 5432
        protocol: TCP
