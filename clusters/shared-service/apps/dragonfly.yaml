---
# ─────────────────────────────────────────────────────────────
# DRAGONFLY
# In-memory data store (Redis-compatible) — replaces Redis
# Port  : 6379
# ─────────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: dragonfly
  namespace: shared-service
  labels:
    app: dragonfly
    environment: shared-service

---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly
  namespace: shared-service
  labels:
    app: dragonfly
    environment: shared-service
spec:
  selector:
    app: dragonfly
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-headless
  namespace: shared-service
  labels:
    app: dragonfly
    environment: shared-service
spec:
  clusterIP: None
  selector:
    app: dragonfly
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dragonfly
  namespace: shared-service
  labels:
    app: dragonfly
    environment: shared-service
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: dragonfly-headless
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly
  template:
    metadata:
      labels:
        app: dragonfly
        environment: shared-service
    spec:
      serviceAccountName: dragonfly
      securityContext:
        fsGroup: 999
      containers:
        - name: dragonfly
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --maxmemory=256mb
            - --maxmemory-policy=allkeys-lru
            - --appendonly=yes
            - --appendfsync=everysec
            - --dir=/data
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: dragonfly-data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: dragonfly-data
        labels:
          app: dragonfly
          environment: shared-service
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
