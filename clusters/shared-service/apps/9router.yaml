---
# ─────────────────────────────────────────────────────────────
# 9ROUTER (nine-router)
# AI API Gateway and Reverse Proxy for LLM providers
# Port     : 20128
# Ingress  : https://ai.gauas.com
# NodePort : 30128
# ─────────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: nine-router
  namespace: shared-service
  labels:
    app: nine-router
    environment: shared-service

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nine-router-data
  namespace: shared-service
  labels:
    app: nine-router
    environment: shared-service
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: nine-router
  namespace: shared-service
  labels:
    app: nine-router
    environment: shared-service
spec:
  type: NodePort
  selector:
    app: nine-router
  ports:
    - name: http
      port: 20128
      targetPort: 20128
      nodePort: 30128

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nine-router
  namespace: shared-service
  labels:
    app: nine-router
    environment: shared-service
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.middlewares: shared-service-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ai.gauas.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nine-router
                port:
                  number: 20128

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nine-router
  namespace: shared-service
  labels:
    app: nine-router
    environment: shared-service
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nine-router
  template:
    metadata:
      labels:
        app: nine-router
        environment: shared-service
    spec:
      serviceAccountName: nine-router
      securityContext:
        fsGroup: 1000
      containers:
        - name: nine-router
          image: decolua/9router:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 20128
          env:
            - name: PORT
              value: "20128"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: DATA_DIR
              value: "/app/data"
            - name: NODE_ENV
              value: "production"
            - name: INITIAL_PASSWORD
              value: "Qu_bao1604"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 20128
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 20128
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nine-router-data
