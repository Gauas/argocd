apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-environments
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - environment: develop
            branch: master
            path: clusters/develop
          - environment: staging
            branch: master
            path: clusters/staging
          - environment: share-resource
            branch: master
            path: clusters/share-resource
          - environment: production
            branch: master
            path: clusters/production
  template:
    metadata:
      name: "{{environment}}-app"
      namespace: argocd
      labels:
        environment: "{{environment}}"
        managed-by: applicationset
      annotations:
        argocd.argoproj.io/managed-by: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/Gauas/argocd.git
        targetRevision: "{{branch}}"
        path: "{{path}}"
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{environment}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - ApplyOutOfSyncOnly=true
